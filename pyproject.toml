[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vsbatera"
version = "0.1.0"
description = "Separa os instrumentos de uma música, limpa cada faixa e gera a versão sem bateria para praticar."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "torchaudio>=2.2", "demucs>=4.0.1",
  "numpy", "scipy", "soundfile", "pedalboard>=0.9",
  "noisereduce>=3.0", "pyloudnorm>=0.1.1", "pyyaml",
]

[project.optional-dependencies]
roformer = ["audio-separator"]
test = ["pytest"]

[project.scripts]
vsbatera = "vsbatera.cli:main"

[tool.setuptools]
packages = ["vsbatera"]
